server:
  port: 8081

spring:
  application:
    name: onlineShopAI

  threads:
    virtual:
      enabled: true

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 4096

    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: shaw/dmeta-embedding-zh

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.redis.RedisVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiEmbeddingModelAutoConfiguration

logging:
  level:
    root: INFO
    com.mall.ai: DEBUG
    org.springframework.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

ai:
  semantic-cache:
    enabled: true
    similarity-threshold: 0.8
    ttl-seconds: 3600
  deepseek:
    timeout-seconds: 60
    retry-times: 3
    fallback-message: "抱歉，AI服务暂时繁忙，请稍后重试。"
